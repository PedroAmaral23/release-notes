
name: Release Notes no Slack

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    env:
      TZ: America/Sao_Paulo
      AZURE_ORG: ${{ vars.AZURE_ORG }}
      AZURE_PROJECT: ${{ vars.AZURE_PROJECT }}
      GOOGLE_DOC_ID: ${{ vars.GOOGLE_DOC_ID }}
      GIT_BEFORE: ${{ github.event.before }}
      GIT_AFTER: ${{ github.sha }}
      DRY_RUN: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar sintaxe
        run: npm run check

      - name: Gerar release notes
        id: release
        shell: bash
        run: |
          node scripts/generate-release.js > release.txt

          if [ -s release.txt ]; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            cat release.txt
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

        env:
          AZURE_TOKEN: ${{ secrets.AZURE_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Enviar para Slack
        if: steps.release.outputs.has_release == 'true' && env.DRY_RUN != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          jq -Rs '{text: .}' release.txt > payload.json

          curl --fail --silent --show-error \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            --data @payload.json \
            "$SLACK_WEBHOOK_URL"
